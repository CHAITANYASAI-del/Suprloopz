name: superloopz

# ---------------------------------------------------------------------------
# SuperLoopz — Vendor Onboarding local development stack
#
# Mirrors the production topology described in the Tech Stack Report v4:
# everything that runs "self-hosted on the Oracle Cloud free VPS via Coolify"
# runs here as a container, on a single internal Docker network.
#
#   postgres   -> primary database (also backs Keycloak)
#   redis      -> cache + rate limiting + idempotency store
#   keycloak   -> auth server (OAuth2 / OIDC / JWT, vendor invite flow)
#   minio      -> self-hosted S3 storage for legal docs (GST/PAN/CIN)
#   backend    -> Node.js + Express API
#   frontend   -> Next.js (Orbit Design System)
#
# Cloudflare R2 and Resend are managed services and are reached over the
# public internet using credentials in .env — they are NOT containers.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: superloopz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superloopz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superloopz_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-superloopz}
      # A second logical database for Keycloak so its tables stay isolated
      # from the application schema.
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superloopz} -d ${POSTGRES_DB:-superloopz}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - superloopz

  redis:
    image: redis:7-alpine
    container_name: superloopz-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-superloopz_redis_password}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-superloopz_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - superloopz

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: superloopz-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-superloopz}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-superloopz_dev_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # SMTP for Keycloak-native emails is optional — SuperLoopz sends
      # transactional mail through Resend from the backend instead.
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - superloopz

  minio:
    image: minio/minio:latest
    container_name: superloopz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-superloopz_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-superloopz_minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - superloopz

  # One-shot job that creates the legal-docs bucket on first boot.
  minio-init:
    image: minio/mc:latest
    container_name: superloopz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-superloopz_minio} ${MINIO_SECRET_KEY:-superloopz_minio_password};
      mc mb --ignore-existing local/${MINIO_BUCKET_LEGAL_DOCS:-superloopz-legal-docs};
      mc anonymous set none local/${MINIO_BUCKET_LEGAL_DOCS:-superloopz-legal-docs};
      echo 'MinIO bucket ready';
      "
    networks:
      - superloopz

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superloopz-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Docker network, services resolve by their service name.
      DATABASE_URL: postgres://${POSTGRES_USER:-superloopz}:${POSTGRES_PASSWORD:-superloopz_dev_password}@postgres:5432/${POSTGRES_DB:-superloopz}
      REDIS_URL: redis://:${REDIS_PASSWORD:-superloopz_redis_password}@redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - superloopz

  # Vendor / consumer portal — public-facing.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PORTAL: vendor
        NEXT_PUBLIC_API_URL: ${NEXTJS_PUBLIC_API_URL:-http://localhost:3000}
    container_name: superloopz-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXTJS_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_PORTAL: vendor
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - superloopz

  # Staff / company admin portal — keep this behind VPN / firewall in production.
  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PORTAL: admin
        NEXT_PUBLIC_API_URL: ${NEXTJS_PUBLIC_API_URL:-http://localhost:3000}
    container_name: superloopz-frontend-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXTJS_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_PORTAL: admin
    ports:
      - "3002:3000"
    depends_on:
      - backend
    networks:
      - superloopz

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  superloopz:
    driver: bridge
