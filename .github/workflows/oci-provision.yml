name: Provision Oracle Free ARM (auto-retry)

# Hunts the free ARM A1.Flex box (the real production target). We already have
# an AMD micro as a fallback, so this:
#   * tries ARM ONLY (no AMD fallback here),
#   * is NOT blocked by the existing AMD instance (it only skips if an *ARM*
#     instance already exists).
# When ARM lands, it prints the public IP — then we migrate off AMD onto it.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: oci-provision
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_ID }}
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Do we already have an ARM instance?
        id: check
        run: |
          STATES=$(oci compute instance list --compartment-id "$COMPARTMENT" \
                     --display-name superloopz --all 2>/dev/null \
                   | jq -r '.data[]? | select(.shape=="VM.Standard.A1.Flex") | ."lifecycle-state"' 2>/dev/null || true)
          if echo "$STATES" | grep -qE 'RUNNING|PROVISIONING|STARTING'; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "ARM instance already exists — nothing to do."
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
            echo "No ARM instance yet — will try ARM (AMD fallback box is untouched)."
          fi

      - name: Attempt ARM launch (1 OCPU / 6 GB — the upgrade box)
        if: steps.check.outputs.exists == '0'
        env:
          AD: ${{ secrets.AD_NAME }}
          SUBNET: ${{ secrets.OCI_SUBNET_ID }}
        run: |
          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/id.pub
          if oci compute instance launch \
               --availability-domain "$AD" --compartment-id "$COMPARTMENT" \
               --shape VM.Standard.A1.Flex --shape-config '{"ocpus":1,"memoryInGBs":6}' \
               --image-id "${{ secrets.IMAGE_ID }}" --subnet-id "$SUBNET" \
               --assign-public-ip true --display-name superloopz \
               --ssh-authorized-keys-file /tmp/id.pub > launch.json 2> err.txt; then
            ID=$(jq -r '.data.id' launch.json)
            echo "ARM LAUNCH SUCCEEDED: $ID"
            sleep 45
            IP=$(oci compute instance list-vnics --instance-id "$ID" \
                   --query 'data[0]."public-ip"' --raw-output 2>/dev/null || echo "pending")
            {
              echo "## 🎉 Free ARM box created!"
              echo ""
              echo "**Public IP:** \`$IP\`  (shape VM.Standard.A1.Flex, 6 GB)"
              echo ""
              echo "Migrate the stack here, then terminate the AMD micro."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "PUBLIC IP: $IP"
          else
            echo "ARM still out of capacity — will retry next run."
            grep -iE 'capacity|TooManyRequests|message' err.txt || cat err.txt || true
          fi
